[project]
name = "theater-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Maksim Suprun", email = "ms.pydev@gmail.com"},
    {name = "Artur Leshko", email = "artur.leshko.01@gmail.com"},
    {name = "Nikita Chebotarevskiy", email = "mikita.chebotarevskiy@gmail.com"},
]
requires-python = "<3.13,>=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0.post1",
    "pydantic[email]==2.5.1",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.0",
    "asyncpg==0.29.0",
    "greenlet==3.0.2",
    "psycopg2-binary==2.9.9",
    "asgi-correlation-id==4.2.0",
    "structlog==22.3.0",
    "environs==9.5.0",
    "httpx==0.23.3",
    "bcrypt==4.1.3",
    "pyjwt[crypto]==2.8.0",
    "python-multipart==0.0.9",
    "google-auth-oauthlib==1.2.0",
    "google-api-python-client==2.136.0",
    "itsdangerous==2.2.0",
    "orjson<4.0.0,>=3.10.15",
]

[dependency-groups]
dev = [
    "pre-commit==3.3.2",
    "ruff==0.0.269",
    "black==23.1.0",
    "isort==5.12.0",
    "pytest==7.2.1",
    "pytest-asyncio==0.20.3",
    "pytest-cov==4.0.0",
    "pytest-mock==3.10.0",
    "faker<34.0.0,>=33.1.0",
    "polyfactory<3.0.0,>=2.18.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = []
ignore = []

[tool.pytest.ini_options]
addopts = "-v -rsxX -l --tb=short --strict-markers"
asyncio_mode = "auto"
filterwarnings = []
markers = ["pytest.mark.asyncio"]
minversion = "6.0"
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
